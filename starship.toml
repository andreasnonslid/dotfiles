# GENERATED by scripts/theme.py. Do not edit.
palette = "dotfiles"
add_newline = false
format = "$status$directory$git_branch$git_status$cmd_duration$character"

[palettes.dotfiles]
bg = "#1e1e2e"
fg = "#cdd6f4"
dim = "#6c7086"
accent = "#cba6f7"
accent2 = "#89b4fa"
warn = "#f9e2af"
urgent = "#f38ba8"
red = "#f38ba8"
green = "#a6e3a1"
blue = "#89b4fa"
cyan = "#94e2d5"
yellow = "#f9e2af"

[directory]
style = "accent bold"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "on [($branch)]($style) "
style = "accent2"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "warn"

[cmd_duration]
format = "took [($duration)]($style) "
style = "dim"

[status]
disabled = false
format = "[$symbol]($style)"
symbol = "✘ "
success_symbol = "✔ "
style = "bold urgent"
success_style = "bold green"
failure_style = "bold urgent"

[time]
disabled = true
format = "[$time]($style) "
style = "dim"
time_format = "%H:%M"

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](urgent)"
