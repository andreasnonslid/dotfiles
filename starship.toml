# ~/.config/starship.toml

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "blue bold"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "on [($branch)]($style) "
style = "green"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

[cmd_duration]
format = "took [($duration)]($style) "
style = "red"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)" 