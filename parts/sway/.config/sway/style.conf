# GENERATED by scripts/theme.py. Do not edit.
default_border pixel 1
gaps inner 4
gaps outer 0
smart_borders on
seat * xcursor_theme dotfiles 24

# Placeholder bar: sway draws it with itself, so the top is never empty while waybar warms up.
# It mirrors waybar's layout (workspaces left, clock right) so the handoff reads as "filling in".
# bar-handoff.sh hides it once waybar has drawn.
bar {
    id boot
    position top
    height 28
    font pango:IosevkaTerm Nerd Font 10
    status_padding 10
    workspace_min_width 30
    tray_output none
    separator_symbol " "
    status_command while date +'  %a %d %b   %H:%M'; do sleep 30; done
    colors {
        background #00000000
        statusline #89b4fa
        focused_workspace #cba6f7 #cba6f7 #1e1e2e
        inactive_workspace #00000000 #00000000 #6c7086
        urgent_workspace #f38ba8 #f38ba8 #1e1e2e
    }
}
