# AeroSpace: mirrors parts/sway (same leader, same keys). Leader = Hyper, sent by the Vial firmware.
# Hints overlay: parts/hammerspoon (optional; the modes below work without it).
config-version = 2
start-at-login = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 6
outer.right = 6
outer.top = 6
outer.bottom = 6

[mode.main.binding]
alt-enter = 'exec-and-forget open -na Ghostty'
# Direct keys: Hyper+X is the same as Hyper+Space then X (mirrors parts/sway/hyper.conf).
# A leaf acts directly; a group enters that mode. z (theme) and o (on-screen keyboard) are Linux-only.
ctrl-alt-cmd-shift-h = 'focus left'
ctrl-alt-cmd-shift-j = 'focus down'
ctrl-alt-cmd-shift-k = 'focus up'
ctrl-alt-cmd-shift-l = 'focus right'
ctrl-alt-cmd-shift-f = 'fullscreen'
ctrl-alt-cmd-shift-x = 'close'
ctrl-alt-cmd-shift-r = 'mode resize'
ctrl-alt-cmd-shift-m = 'mode move'
ctrl-alt-cmd-shift-t = 'mode layout'
ctrl-alt-cmd-shift-a = 'mode launch'
ctrl-alt-cmd-shift-q = 'mode session'
ctrl-alt-cmd-shift-1 = 'workspace 1'
ctrl-alt-cmd-shift-2 = 'workspace 2'
ctrl-alt-cmd-shift-3 = 'workspace 3'
ctrl-alt-cmd-shift-4 = 'workspace 4'
ctrl-alt-cmd-shift-5 = 'workspace 5'
ctrl-alt-cmd-shift-6 = 'workspace 6'
ctrl-alt-cmd-shift-7 = 'workspace 7'
ctrl-alt-cmd-shift-8 = 'workspace 8'
ctrl-alt-cmd-shift-9 = 'workspace 9'
ctrl-alt-cmd-shift-space = ['mode leader', 'exec-and-forget open -g hammerspoon://leader']

[mode.leader.binding]
h = ['focus left', 'mode main']
j = ['focus down', 'mode main']
k = ['focus up', 'mode main']
l = ['focus right', 'mode main']
shift-h = ['move left', 'mode main']
shift-j = ['move down', 'mode main']
shift-k = ['move up', 'mode main']
shift-l = ['move right', 'mode main']
1 = ['workspace 1', 'mode main']
2 = ['workspace 2', 'mode main']
3 = ['workspace 3', 'mode main']
4 = ['workspace 4', 'mode main']
5 = ['workspace 5', 'mode main']
6 = ['workspace 6', 'mode main']
7 = ['workspace 7', 'mode main']
8 = ['workspace 8', 'mode main']
9 = ['workspace 9', 'mode main']
f = ['fullscreen', 'mode main']
x = ['close', 'mode main']
r = 'mode resize'
m = 'mode move'
t = 'mode layout'
a = 'mode launch'
q = 'mode session'
esc = 'mode main'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
k = 'resize height -50'
j = 'resize height +50'
esc = 'mode main'

[mode.move.binding]
1 = ['move-node-to-workspace 1', 'mode main']
2 = ['move-node-to-workspace 2', 'mode main']
3 = ['move-node-to-workspace 3', 'mode main']
4 = ['move-node-to-workspace 4', 'mode main']
5 = ['move-node-to-workspace 5', 'mode main']
6 = ['move-node-to-workspace 6', 'mode main']
7 = ['move-node-to-workspace 7', 'mode main']
8 = ['move-node-to-workspace 8', 'mode main']
9 = ['move-node-to-workspace 9', 'mode main']
esc = 'mode main'

[mode.layout.binding]
s = ['layout v_accordion', 'mode main']
w = ['layout h_accordion', 'mode main']
e = ['layout tiles horizontal vertical', 'mode main']
v = ['split vertical', 'mode main']
b = ['split horizontal', 'mode main']
esc = 'mode main'

[mode.launch.binding]
t = ['exec-and-forget open -na Ghostty', 'mode main']
d = ['exec-and-forget open -a Raycast', 'mode main']
esc = 'mode main'

[mode.session.binding]
l = ['exec-and-forget pmset displaysleepnow', 'mode main']
s = ['exec-and-forget pmset sleepnow', 'mode main']
esc = 'mode main'
