# AeroSpace: mirrors parts/sway (same leader, same keys).
# Hyper is Caps Lock as ctrl+alt+cmd, with Shift NOT included, so Shift can
# still choose move vs focus. Raycast Hyper Key → Include Shift must be off.
# Hints overlay: parts/hammerspoon (optional; the modes below work without it).
config-version = 2
start-at-login = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false

# Menu bar icon is AeroSpace's own. Style is an app preference (not a toml key):
# i3Ordered = filled chip for the workspace you are on, outline for the others
# that have windows. The icon stays black or white; the menu bar cannot take a color.
# defaults write bobko.aerospace displayStyle -string i3Ordered

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

[mode.main.binding]
alt-enter = 'exec-and-forget open -na Ghostty'
# Direct keys: Hyper+X is the same as Hyper+Space then X (mirrors parts/sway/hyper.conf).
# Hyper+Shift+X moves. A leaf acts directly; a group enters that mode.
# z (theme) and o (on-screen keyboard) are Linux-only.
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'
ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'
ctrl-alt-cmd-f = 'fullscreen'
ctrl-alt-cmd-x = 'close'
ctrl-alt-cmd-r = [
  'mode resize',
  'exec-and-forget open -g hammerspoon://submode?name=resize',
]
ctrl-alt-cmd-m = [
  'mode move',
  'exec-and-forget open -g hammerspoon://submode?name=move',
]
ctrl-alt-cmd-t = [
  'mode layout',
  'exec-and-forget open -g hammerspoon://submode?name=layout',
]
ctrl-alt-cmd-a = [
  'mode launch',
  'exec-and-forget open -g hammerspoon://submode?name=launch',
]
ctrl-alt-cmd-q = [
  'mode session',
  'exec-and-forget open -g hammerspoon://submode?name=session',
]
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'
ctrl-alt-cmd-7 = 'workspace 7'
ctrl-alt-cmd-8 = 'workspace 8'
ctrl-alt-cmd-9 = 'workspace 9'
ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-cmd-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-cmd-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-cmd-shift-8 = 'move-node-to-workspace 8'
ctrl-alt-cmd-shift-9 = 'move-node-to-workspace 9'
ctrl-alt-cmd-space = [
  'mode leader',
  'exec-and-forget open -g hammerspoon://leader',
]

[mode.leader.binding]
h = ['focus left', 'mode main']
j = ['focus down', 'mode main']
k = ['focus up', 'mode main']
l = ['focus right', 'mode main']
shift-h = ['move left', 'mode main']
shift-j = ['move down', 'mode main']
shift-k = ['move up', 'mode main']
shift-l = ['move right', 'mode main']
1 = ['workspace 1', 'mode main']
2 = ['workspace 2', 'mode main']
3 = ['workspace 3', 'mode main']
4 = ['workspace 4', 'mode main']
5 = ['workspace 5', 'mode main']
6 = ['workspace 6', 'mode main']
7 = ['workspace 7', 'mode main']
8 = ['workspace 8', 'mode main']
9 = ['workspace 9', 'mode main']
f = ['fullscreen', 'mode main']
x = ['close', 'mode main']
r = ['mode resize', 'exec-and-forget open -g hammerspoon://submode?name=resize']
m = ['mode move', 'exec-and-forget open -g hammerspoon://submode?name=move']
t = ['mode layout', 'exec-and-forget open -g hammerspoon://submode?name=layout']
a = ['mode launch', 'exec-and-forget open -g hammerspoon://submode?name=launch']
q = [
  'mode session',
  'exec-and-forget open -g hammerspoon://submode?name=session',
]
ctrl-alt-cmd-space = [
  'mode main',
  'exec-and-forget open -g hammerspoon://dismiss',
]
esc = 'mode main'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
k = 'resize height -50'
j = 'resize height +50'
ctrl-alt-cmd-space = [
  'mode main',
  'exec-and-forget open -g hammerspoon://dismiss',
]
esc = 'mode main'

[mode.move.binding]
1 = ['move-node-to-workspace 1', 'mode main']
2 = ['move-node-to-workspace 2', 'mode main']
3 = ['move-node-to-workspace 3', 'mode main']
4 = ['move-node-to-workspace 4', 'mode main']
5 = ['move-node-to-workspace 5', 'mode main']
6 = ['move-node-to-workspace 6', 'mode main']
7 = ['move-node-to-workspace 7', 'mode main']
8 = ['move-node-to-workspace 8', 'mode main']
9 = ['move-node-to-workspace 9', 'mode main']
ctrl-alt-cmd-space = [
  'mode main',
  'exec-and-forget open -g hammerspoon://dismiss',
]
esc = 'mode main'

[mode.layout.binding]
s = ['layout v_accordion', 'mode main']
w = ['layout h_accordion', 'mode main']
e = ['layout tiles horizontal vertical', 'mode main']
ctrl-alt-cmd-space = [
  'mode main',
  'exec-and-forget open -g hammerspoon://dismiss',
]
esc = 'mode main'

[mode.launch.binding]
t = ['exec-and-forget open -na Ghostty', 'mode main']
d = ['exec-and-forget open -a Raycast', 'mode main']
ctrl-alt-cmd-space = [
  'mode main',
  'exec-and-forget open -g hammerspoon://dismiss',
]
esc = 'mode main'

[mode.session.binding]
l = ['exec-and-forget open -g hammerspoon://lock', 'mode main']
s = [
  "exec-and-forget /usr/bin/osascript -e 'tell application \"System Events\" to shut down'",
  'mode main',
]
r = [
  "exec-and-forget /usr/bin/osascript -e 'tell application \"System Events\" to restart'",
  'mode main',
]
ctrl-alt-cmd-space = [
  'mode main',
  'exec-and-forget open -g hammerspoon://dismiss',
]
esc = 'mode main'
