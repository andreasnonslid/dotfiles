# The prefix for tmux
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Buffer handling
set -g set-clipboard on

# Use panes!
setw -g pane-base-index 1
bind | split-window -h
bind - split-window -v
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Use sessions!
# bind-key -T sessions s choose-session
# bind-key -T sessions d detach-client
# bind-key -T sessions r rename-session -t= new-name
# bind-key -T sessions n new-session
# bind s choose-tree -ZT sessions

# Use windows!
set -g base-index 1
bind c new-window
bind -r L next-window
bind -r H previous-window

bind-key -r 0 select-window -t :0 # not supposed to be used, but set for pattern and just in case
bind-key -r 1 select-window -t :1
bind-key -r 2 select-window -t :2
bind-key -r 3 select-window -t :3
bind-key -r 4 select-window -t :4
bind-key -r 5 select-window -t :5
bind-key -r 6 select-window -t :6
bind-key -r 7 select-window -t :7
bind-key -r 8 select-window -t :8
bind-key -r 9 select-window -t :9

# Interactive window selection
bind w choose-tree -Zw
bind , command-prompt "rename-window %%"
bind f command-prompt "find-window %%"
bind ? run-shell "tmux new-window \"nvim ~/.tmux.conf\""
# Custom killer function
unbind q
bind q if-shell "[ `tmux list-panes | wc -l` -gt 1 ]" "kill-pane" "kill-window"

# Use buffers!
# bind [ copy-mode
# prefix + b + command
# bind-key -T buffers b list-buffers
# bind-key -T buffers p paste-buffer
# bind-key -T buffers d delete-buffer
# bind b choose-tree -ZT buffers

# Mouse
set -g mouse 

# Enable status bar
set -g status on

# "Random" color variables
# https://superuser.com/questions/285381/how-does-the-tmux-color-palette-work

# Configure status bar
set -g status-style bg=black,fg=white
set -g status-left "#[fg=colour220]#I:#{pane_index}#[default] \u2192 "
set -g status-right "#[fg=colour231] %d-%m-%Y - %H:%M - %a#[default]"
set -g status-interval 60

# Update window status formats
set -g window-status-format '#[fg=colour105,bg=default]#I:#W#F'
set -g window-status-current-format '#[fg=colour201]#I:#W#F#[default]'

# Performance
set-option -g history-limit 10000
set -sg escape-time 1

# Reload tmux config with prefix, then r
bind r source-file ~/.tmux.conf
