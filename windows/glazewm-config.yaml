# GlazeWM config -- Alt-based tiling keybinds mirroring the Hyprland setup
# (bashrc/.config/hypr/hyprland.lua) and the still-to-land AeroSpace config
# (M19, mac-setup backlog), so the same muscle memory transfers across
# Linux, Windows and (eventually) macOS. All three now use Alt as the
# window-management modifier -- see the mac-setup backlog's M19 note for
# why Alt was picked over Cmd on macOS; the same reasoning (avoid fighting
# the OS's own modifier) applies here against Windows' own Alt-based menu
# access, which GlazeWM's binding mode already coexists with fine in
# practice.
#
# Written and reviewed against GlazeWM's documented config schema
# (github.com/glzr-io/glazewm) but never run for real -- there is no
# Windows environment available to test this in. Copy or symlink to
# %userprofile%\.glzr\glazewm\config.yaml, e.g. from PowerShell:
#   New-Item -ItemType SymbolicLink -Path "$env:USERPROFILE\.glzr\glazewm\config.yaml" -Target "<path-to-this-repo>\windows\glazewm-config.yaml"
# (symlink creation on Windows needs an elevated/Developer Mode shell.)
#
# Mapping from Hyprland's SUPER+<key> binds to GlazeWM's alt+<key>, and
# what deliberately isn't carried over:
#   Q     terminal            -> shell-exec wezterm (already configured: windows/wezterm.lua)
#   C     close window        -> close
#   V     toggle floating     -> toggle-floating
#   J     toggle split axis   -> toggle-tiling-direction (dwindle "togglesplit" equivalent)
#   E     file manager        -> shell-exec explorer (Windows' own, in place of Hyprland's dolphin)
#   arrows / shift+arrows     -> focus / move --direction (exact match)
#   0-9 / shift+0-9           -> focus / move --workspace (exact match, 0 = workspace 10)
#   R     app launcher (rofi) -> repurposed: enter resize mode (no Windows launcher was
#                                 bound here to begin with, and GlazeWM has no keyboard
#                                 resize otherwise -- Hyprland does this via SUPER+drag)
#   F     (not in Hyprland)   -> toggle-fullscreen -- added since it's a core tiling
#                                 action and F was unclaimed, not a literal mirror
#   M     wlogout             -> skipped, no direct Windows equivalent worth binding
#   P     pseudo tiling       -> skipped, dwindle-specific concept, no GlazeWM analogue
#   S / shift+S  scratchpad   -> skipped, GlazeWM has no special-workspace/scratchpad
#                                 concept to map onto
#   shift+W  wallpaper script -> skipped, script-specific
#   Space    kb layout toggle -> skipped, Windows already has its own native toggle
#   L        lock             -> skipped, Win+L already does this system-wide
#   Print    screenshot       -> skipped, Win+Shift+S already does this system-wide
#   mouse drag move/resize    -> approximated by the resize binding mode below
#     (keyboard-driven instead of live-drag, since that's how GlazeWM does it)

general:
    focus_follows_cursor: false
    toggle_workspace_on_refocus: false

# No gaps -- GlazeWM's own built-in default (used whenever this section is
# left out entirely) is a visible inner gap plus a large top outer gap, not
# zero.
gaps:
    scale_with_dpi: true
    inner_gap: "0px"
    outer_gap:
        top: "0px"
        right: "0px"
        bottom: "0px"
        left: "0px"

workspaces:
    - name: "1"
    - name: "2"
    - name: "3"
    - name: "4"
    - name: "5"
    - name: "6"
    - name: "7"
    - name: "8"
    - name: "9"
    - name: "10"

keybindings:
    - commands: ["shell-exec wezterm"]
      bindings: ["alt+q"]
    - commands: ["close"]
      bindings: ["alt+c"]
    - commands: ["toggle-floating --centered"]
      bindings: ["alt+v"]
    - commands: ["toggle-tiling-direction"]
      bindings: ["alt+j"]
    - commands: ["shell-exec explorer"]
      bindings: ["alt+e"]
    - commands: ["toggle-fullscreen"]
      bindings: ["alt+f"]

    # Focus with alt + arrow keys
    - commands: ["focus --direction left"]
      bindings: ["alt+left"]
    - commands: ["focus --direction right"]
      bindings: ["alt+right"]
    - commands: ["focus --direction up"]
      bindings: ["alt+up"]
    - commands: ["focus --direction down"]
      bindings: ["alt+down"]

    # Move the active window with alt + shift + arrow keys
    - commands: ["move --direction left"]
      bindings: ["alt+shift+left"]
    - commands: ["move --direction right"]
      bindings: ["alt+shift+right"]
    - commands: ["move --direction up"]
      bindings: ["alt+shift+up"]
    - commands: ["move --direction down"]
      bindings: ["alt+shift+down"]

    # Switch workspaces with alt + [0-9]; 0 maps to workspace 10, matching
    # the Hyprland `i % 10` binding loop.
    - commands: ["focus --workspace 1"]
      bindings: ["alt+1"]
    - commands: ["focus --workspace 2"]
      bindings: ["alt+2"]
    - commands: ["focus --workspace 3"]
      bindings: ["alt+3"]
    - commands: ["focus --workspace 4"]
      bindings: ["alt+4"]
    - commands: ["focus --workspace 5"]
      bindings: ["alt+5"]
    - commands: ["focus --workspace 6"]
      bindings: ["alt+6"]
    - commands: ["focus --workspace 7"]
      bindings: ["alt+7"]
    - commands: ["focus --workspace 8"]
      bindings: ["alt+8"]
    - commands: ["focus --workspace 9"]
      bindings: ["alt+9"]
    - commands: ["focus --workspace 10"]
      bindings: ["alt+0"]

    # Move the active window to a workspace with alt + shift + [0-9]
    - commands: ["move --workspace 1", "focus --workspace 1"]
      bindings: ["alt+shift+1"]
    - commands: ["move --workspace 2", "focus --workspace 2"]
      bindings: ["alt+shift+2"]
    - commands: ["move --workspace 3", "focus --workspace 3"]
      bindings: ["alt+shift+3"]
    - commands: ["move --workspace 4", "focus --workspace 4"]
      bindings: ["alt+shift+4"]
    - commands: ["move --workspace 5", "focus --workspace 5"]
      bindings: ["alt+shift+5"]
    - commands: ["move --workspace 6", "focus --workspace 6"]
      bindings: ["alt+shift+6"]
    - commands: ["move --workspace 7", "focus --workspace 7"]
      bindings: ["alt+shift+7"]
    - commands: ["move --workspace 8", "focus --workspace 8"]
      bindings: ["alt+shift+8"]
    - commands: ["move --workspace 9", "focus --workspace 9"]
      bindings: ["alt+shift+9"]
    - commands: ["move --workspace 10", "focus --workspace 10"]
      bindings: ["alt+shift+0"]

    - commands: ["wm-enable-binding-mode --name resize"]
      bindings: ["alt+r"]

# Keyboard-driven resize, entered via alt+r above -- the closest GlazeWM
# equivalent to Hyprland's SUPER+drag live resize. hjkl and arrows both
# work; escape/enter/alt+r again all exit back to normal bindings.
binding_modes:
    - name: "resize"
      keybindings:
          - commands: ["resize --width -2%"]
            bindings: ["h", "left"]
          - commands: ["resize --width +2%"]
            bindings: ["l", "right"]
          - commands: ["resize --height -2%"]
            bindings: ["k", "up"]
          - commands: ["resize --height +2%"]
            bindings: ["j", "down"]
          - commands: ["wm-disable-binding-mode --name resize"]
            bindings: ["escape", "enter", "alt+r"]
